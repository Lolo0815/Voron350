[gcode_macro _TOOL_RUNOUT]
gcode:
  {% set triggered_tool = params.TOOL | int %}
  # Holt die Nummer des aktuell geladenen Werkzeugs aus KTC-Easy
  {% set active_tool = printer.toolchanger.tool_number | default(-1) | int %}

  {% if triggered_tool == active_tool %}
    { action_respond_info("Filament-Runout auf aktivem Werkzeug T" ~ triggered_tool ~ " erkannt!") }
    PAUSE # Ruft das Standard-Klipper-Pause-Makro auf
    M117 Runout T{triggered_tool}
  {% else %}
    # Ignoriert das Signal, wenn das Werkzeug nur im Dock parkt
    { action_respond_info("Runout an inaktivem Werkzeug T" ~ triggered_tool ~ " ignoriert.") }
  {% endif %}
