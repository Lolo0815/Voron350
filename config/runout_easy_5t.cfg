# ======================================================================
# READ-ONLY FILAMENT SENSOR CONFIGURATION FOR 5x SB2209 TOOLCHANGER
# SYSTEM: KTC-EASY (KLIPPER-TOOLCHANGER)
# ======================================================================

[filament_switch_sensor runout_T0]
switch_pin: !T0:PB6  # Hardware-Pin Tool 0 (Fest verdrahtet)
pause_on_runout: False        # Verhindert unkontrollierte Klipper-Stopps im Hintergrund
runout_gcode:
  {% if printer["toolchanger"].tool_number == 0 %}
    RESPOND TYPE=error MSG="Filament-Runout an Werkzeug T0 detektiert!"
    BASE_PAUSE
  {% endif %}

[filament_switch_sensor runout_T1]
switch_pin: !T1:PB6  # Hardware-Pin Tool 1
pause_on_runout: False
runout_gcode:
  {% if printer["toolchanger"].tool_number == 1 %}
    RESPOND TYPE=error MSG="Filament-Runout an Werkzeug T1 detektiert!"
    BASE_PAUSE
  {% endif %}

