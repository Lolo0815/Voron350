switch_pin: !T2:PB6  # Hardware-Pin Tool 2
pause_on_runout: False
runout_gcode:
  {% if printer["toolchanger"].tool_number == 2 %}
    RESPOND TYPE=error MSG="Filament-Runout an Werkzeug T2 detektiert!"
    BASE_PAUSE
  {% endif %}

[filament_switch_sensor runout_T3]
switch_pin: !T3:PB6  # Hardware-Pin Tool 3
pause_on_runout: False
runout_gcode:
  {% if printer["toolchanger"].tool_number == 3 %}
    RESPOND TYPE=error MSG="Filament-Runout an Werkzeug T3 detektiert!"
