    BASE_PAUSE
  {% endif %}

# ======================================================================
# AUTOMATISCHE TRAFFIC-KONTROLLE (MAKROROUTINEN)
# ======================================================================

[gcode_macro _DISABLE_ALL_RUNOUT_SENSORS]
gcode:
  SET_FILAMENT_SENSOR SENSOR=runout_T0 ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=runout_T1 ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=runout_T2 ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=runout_T3 ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=runout_T4 ENABLE=0

[gcode_macro _ENABLE_ACTIVE_RUNOUT_SENSOR]
gcode:
  {% set active_tool = printer["toolchanger"].tool_number | default(-1) | int %}
  {% if active_tool >= 0 and active_tool <= 4 %}
    SET_FILAMENT_SENSOR SENSOR=runout_T{active_tool} ENABLE=1
    RESPOND MSG="Filamentsensor fuer aktivierte Nozzle T{active_tool} scharfgeschaltet."
  {% endif %}
