[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
    
    M117 Aufheizen...
    M140 S{BED_TEMP}                         # Bett aufheizen starten
    M104 S150                                # Extruder auf Vorwärmtemperatur (verhindert Oozing)
    
    G90                                      # Absolute Positionierung
    G28                                      # Homing aller Achsen
    M190 S{BED_TEMP}                         # Warten aufs Bett
    
    M117 Gantry Leveling...
    QUAD_GANTRY_LEVEL                        # Voron 2.4 Gantry Ausrichtung
    G28 Z                                    # Erneutes Z-Homing nach QGL
    
    # BED_MESH_PROFILE LOAD=default          # Falls du ein Bed-Mesh nutzt, hier einkommentieren
    
    G1 X5 Y5 Z10 F18000                      # Fahre nahe an die Startposition
    M109 S{EXTRUDER_TEMP}                    # Warten auf Drucktemperatur
    
    M117 Drucke Prime-Line...
    G92 E0
    G1 Z0.3 F900
    G1 X100 E20 F1000                        # Prime Line (Anpresslinie)
    G92 E0

[gcode_macro PRINT_END]
gcode:
    M400                                     # Warte auf Puffer-Leerung
    G92 E0
    G1 E-5 F3600                             # Filament zurückziehen (Retract gegen Fäden)
    G91
    G1 Z10 F900                              # Werkzeugkopf 10mm anheben
    G90
    G1 X175 Y340 F18000                      # Kopf hinten mittig parken (bei 350er Voron anpassen)
    
    M104 S0                                  # Hotend ausschalten
    M140 S0                                  # Bett ausschalten
    M106 S0                                  # Bauteillüfter aus
    M117 Druck beendet.
