[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set x_park = 10.0 %}                  # Sichere X-Parkposition
    {% set y_park = 10.0 %}                  # Sichere Y-Parkposition
    {% set z_lift = 10.0 %}                  # Wie weit die Düse abheben soll
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-2 F2700                             # Filament leicht zurückziehen (Retract)
    G1 Z{z_safe} F900                        # Düse anheben
    G90
    G1 X{x_park} Y{y_park} F18000            # In die Parkecke fahren
    SET_IDLE_TIMEOUT TIMEOUT=43200           # Verlängert das Timeout auf 12 Std (verhindert Abkühlen/Positionsverlust)

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    # Aktives KTC Werkzeug ermitteln
    {% set active_tool = printer.ktc.active_tool|default(-1)|int %}
    
    # Dynamischen Namen des Sensors für das aktive Werkzeug erzeugen
    {% set sensor_name = "filament_switch_sensor tool_sensor_" ~ active_tool %}
    
    {% if active_tool >= 0 and sensor_name in printer %}
        # Sensor-Status abfragen (filament_detected gibt True/False zurück)
        {% set filament_detected = printer[sensor_name].filament_detected %}
        
        {% if not filament_detected %}
            {action_raise_error("RESUME abgelehnt! Kein Filament in Werkzeug T%d erkannt. Bitte laden!" % active_tool)}
        {% else %}
            {action_respond_info("Filament in Werkzeug T%d erkannt. Druck wird fortgesetzt.")}
            BASE_RESUME
        {% endif %}
    {% else %}
        # Falls kein gültiges Werkzeug aktiv ist (z.B. vor dem ersten Toolchange), normal fortsetzen
        {action_respond_info("Kein aktives KTC-Werkzeug definiert. Setze standardmäßig fort.")}
        BASE_RESUME
    {% endif %}


#[gcode_macro RESUME]
#rename_existing: BASE_RESUME
#gcode:
