# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu T3]
#canbus_uuid:dc01ef4b97ae # T4 ( GRÜN )
canbus_uuid:ca7d1914bb41 # T3 (KLAR )
#canbus_uuid:ea3f4a00f58f # T2 ( WEISS )
#canbus_uuid:2dd09adec607 # T1 ( BLAU )
#canbus_uuid:f4e8f320f21f # T0 ( ROT )

[extruder3]
step_pin: T3:PD0
dir_pin: !T3:PD1
enable_pin: !T3:PD2
microsteps: 16
rotation_distance: 22.66 #  #22.23
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: T3:PB13
sensor_type: Generic 3950
sensor_pin: T3:PA3
#spi_bus: spi1
#rtd_nominal_r: 100
#rtd_reference_r: 430
#rtd_num_of_wires: 2
control: pid
pid_Kp=19.774
pid_Ki=2.028
pid_Kd=48.200
min_temp: 0
max_temp: 350
max_extrude_cross_section: 6
min_extrude_temp: 180
#pressure_advance: 0.035                                               # See tuning pressure advance doc
#pressure_advance_smooth_time: 0.040

[tmc2209 extruder3]
uart_pin: T3:PA15
run_current: 0.650
#hold_current: 0.1
#driver_TPOWERDOWN: 20
stealthchop_threshold: 999999

[temperature_sensor Tool_Klar]
sensor_type: Generic 3950 #ATC Semitec 104NT-4-R025H42G Generic 3950
sensor_pin: T3: PA2

[fan_generic T3_partfan]
pin: T3:PA1

[heater_fan T3_hotend_fan]
pin: T3:PA0
heater: extruder3
heater_temp: 50.0

[gcode_macro T3]
variable_color: ""
gcode:
  SELECT_TOOL T=3

[tool T3]
tool_number: 3
extruder: extruder3
#detection_pin: EBBCan:PB5
fan: fan_generic T3_partfan
gcode_x_offset: 0.450
gcode_y_offset: -0.900
gcode_z_offset: 2.100
# Position with the toolhead aligned with the dock
params_park_x: 4.05
params_park_y: -5.5
params_park_z: 299.1

[tool_probe T3]
pin: T3:PB5
tool: 3
z_offset: -0.700
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder3
