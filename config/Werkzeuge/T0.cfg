# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu T0]
#canbus_uuid:dc01ef4b97ae # T4 ( GRÜN )
#canbus_uuid:ea3f4a00f58f # T3 (KLAR )
#canbus_uuid:ca7d1914bb41 # T2 ( WEISS )
#canbus_uuid:2dd09adec607 # T1 ( BLAU )
canbus_uuid:f4e8f320f21f # T0 ( ROT )

[adxl345]
cs_pin: T0: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: z,-y,x

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75  # default is 75
probe_points:
    # Somewhere slightly above the middle of your print bed
    175,175, 20

[temperature_sensor Tool_Rot]
sensor_type: Generic 3950
sensor_pin: T0: PA2

[extruder]
step_pin: T0:PD0
dir_pin: T0:PD1
enable_pin: !T0:PD2
microsteps: 16
rotation_distance: 22.23 #  #22.23
gear_ratio: 50:10
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: T0:PB13
sensor_type: Generic 3950
sensor_pin: T0:PA3
#spi_bus: spi1
#rtd_nominal_r: 100
#rtd_reference_r: 430
#rtd_num_of_wires: 2
control: pid
pid_Kp=25.667
pid_Ki=2.806
pid_Kd=58.737
min_temp: 0
max_temp: 350
max_extrude_cross_section: 6
min_extrude_temp: 180
#pressure_advance: 0.035                                               # See tuning pressure advance doc
#pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: T0:PA15
run_current: 0.6
#hold_current: 0.1
#driver_TPOWERDOWN: 20
stealthchop_threshold: 999999

[fan_generic T0_partfan]
pin: T0:PA1

[heater_fan T0_hotend_fan]
pin: T0:PA0
heater: extruder
heater_temp: 50.0

[gcode_macro T0]
variable_color: ""
gcode:
  SELECT_TOOL T=0

[tool T0]
tool_number: 0
extruder: extruder
#detection_pin: EBBCan:PB5
fan: fan_generic T0_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 11.5
params_park_y: 6.5
params_park_z: 307.5

[tool_probe T0]
pin: T0:PB5
tool: 0
z_offset: -1.30
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode: _TAP_PROBE_ACTIVATE HEATER=extruder
